<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#0f172a">
    <title>Offline - IT Support</title>
    <style>
        *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f7fb;color:#14243b;font-family:Inter,"Segoe UI",Arial,sans-serif}.card{width:min(100%,480px);padding:32px;border:1px solid #e2e8f0;border-radius:20px;background:#fff;box-shadow:0 12px 40px rgba(15,23,42,.08)}.mark{display:grid;place-items:center;width:48px;height:48px;border-radius:15px;background:#eaf1ff;color:#1746a2;font-weight:800}.eyebrow{margin:22px 0 6px;color:#2563eb;font-size:11px;font-weight:800;letter-spacing:.12em}h1{margin:0;font-size:27px;letter-spacing:-.03em}p{color:#68788e;line-height:1.6}.hint{padding:12px;border-radius:10px;background:#f4f7fb;font-size:13px}
    </style>
</head>
<body>
    <main class="card">
        <span class="mark" aria-hidden="true">IT</span>
        <p class="eyebrow">CONNECTION INTERRUPTED</p>
        <h1>You are offline</h1>
        <p>The support workspace could not be reached. Your private pages and form data are not stored for offline use.</p>
        <p class="hint">Reconnect to the network and reload this page to continue.</p>
    </main>
</body>
</html>
